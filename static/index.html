<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>looksmaxxing.guide — flow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ground:#0D1311; --panel:#141B19; --ink:#E7ECEA; --ink-2:#96A39F;
    --line:#25302D; --accent:#54C4AF; --accent-ink:#7FD6C6; --accent-tint:#12302B;
    --amber:#E2B45E; --sans:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    line-height:1.5; display:grid; grid-template-columns:minmax(340px,420px) 1fr; min-height:100vh;}
  @media (max-width:820px){body{grid-template-columns:1fr;}}
  .control{padding:1.75rem 1.5rem; border-right:1px solid var(--line); display:flex;
    flex-direction:column; gap:1.25rem;}
  .brand{font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-ink);}
  h1{font-size:1.35rem; margin:.2rem 0 0; font-weight:600;}
  .sub{color:var(--ink-2); font-size:.9rem; margin:0;}
  form{display:flex; flex-direction:column; gap:.6rem;}
  input[type=text]{background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:9px; padding:.7rem .8rem; font:inherit;}
  input[type=text]:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .row{display:flex; align-items:center; gap:.5rem; font-size:.85rem; color:var(--ink-2);}
  button{background:var(--accent); color:#08201C; border:0; border-radius:9px; padding:.7rem 1rem;
    font:600 1rem var(--sans); cursor:pointer;}
  button:disabled{opacity:.5; cursor:default;}
  .stages{display:flex; flex-direction:column; gap:.6rem; margin-top:.25rem;}
  .stage{display:flex; align-items:flex-start; gap:.7rem; padding:.8rem .9rem; border:1px solid var(--line);
    border-radius:11px; background:var(--panel); transition:border-color .2s,background .2s;}
  .stage[data-state=active]{border-color:var(--accent); background:var(--accent-tint);}
  .stage[data-state=done]{border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
  .stage[data-state=fail]{border-color:var(--amber);}
  .dot{width:1.4rem; height:1.4rem; border-radius:50%; border:1px solid var(--line); flex:none;
    display:grid; place-items:center; font-family:var(--mono); font-size:.7rem; color:var(--ink-2);}
  .stage[data-state=active] .dot{border-color:var(--accent); color:var(--accent-ink);}
  .stage[data-state=done] .dot{background:var(--accent); color:#08201C; border-color:var(--accent);}
  .stage[data-state=fail] .dot{border-color:var(--amber); color:var(--amber);}
  .stage-name{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;}
  .stage-note{font-size:.85rem; color:var(--ink-2); margin-top:.15rem;}
  .report{border-top:1px solid var(--line); padding-top:1rem; font-size:.85rem;}
  .report h2{font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-2); margin:0 0 .6rem;}
  .issue{padding:.5rem .65rem; border-radius:8px; background:var(--panel); border:1px solid var(--line);
    margin-bottom:.4rem;}
  .issue .sev{font-family:var(--mono); font-size:.65rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--amber);}
  .ok{color:var(--accent-ink);}
  .preview{position:relative; background:#fff;}
  .preview iframe{border:0; width:100%; height:100%; display:block;}
  .empty{position:absolute; inset:0; display:grid; place-items:center; color:var(--ink-2);
    background:var(--ground); font-size:.9rem; text-align:center; padding:2rem;}
</style>
</head>
<body>
  <aside class="control">
    <div>
      <div class="brand">looksmaxxing.guide · pipeline</div>
      <h1>generate → validate → publish</h1>
      <p class="sub">Type a topic and watch the agent flow run. The published guide renders on the right.</p>
    </div>
    <form id="form">
      <input type="text" id="topic" value="skincare basics" autocomplete="off" placeholder="e.g. jawline, grooming basics">
      <label class="row"><input type="checkbox" id="demo"> Use bundled sample (no API key)</label>
      <button id="go" type="submit">Run flow</button>
    </form>
    <div class="stages" id="stages">
      <div class="stage" data-stage="generate"><div class="dot">1</div><div><div class="stage-name">Generate</div><div class="stage-note">draft the guide JSON</div></div></div>
      <div class="stage" data-stage="validate"><div class="dot">2</div><div><div class="stage-name">Validate</div><div class="stage-note">schema + safety review</div></div></div>
      <div class="stage" data-stage="publish"><div class="dot">3</div><div><div class="stage-name">Publish</div><div class="stage-note">render the guide page</div></div></div>
    </div>
    <div class="report" id="report" hidden></div>
  </aside>
  <main class="preview">
    <iframe id="frame" title="Published guide preview"></iframe>
    <div class="empty" id="empty">The published guide will appear here.</div>
  </main>
<script>
const form = document.getElementById('form');
const go = document.getElementById('go');
const stagesEl = document.getElementById('stages');
const reportEl = document.getElementById('report');
const frame = document.getElementById('frame');
const empty = document.getElementById('empty');

const setState = (stage, state) =>
  stagesEl.querySelector(`[data-stage=${stage}]`).dataset.state = state;
const reset = () => ['generate','validate','publish'].forEach(s => setState(s, ''));
const wait = ms => new Promise(r => setTimeout(r, ms));

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  go.disabled = true;
  reportEl.hidden = true;
  reset();
  setState('generate', 'active');
  try {
    const response = await fetch('/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        topic: document.getElementById('topic').value,
        demo: document.getElementById('demo').checked,
      }),
    });
    if (!response.ok) throw new Error((await response.json()).error || response.statusText);
    const data = await response.json();

    // Reveal stages in order for legibility; the run already completed server-side.
    setState('generate', 'done'); await wait(350);
    setState('validate', 'active'); await wait(400);
    setState('validate', data.report.passed ? 'done' : 'fail'); await wait(350);
    setState('publish', 'active'); await wait(300);
    setState('publish', 'done');

    frame.srcdoc = data.html;
    empty.hidden = true;
    renderReport(data);
  } catch (err) {
    setState('generate', 'fail');
    reportEl.hidden = false;
    reportEl.innerHTML = `<h2>Error</h2><div class="issue">${err.message}</div>`;
  } finally {
    go.disabled = false;
  }
});

function renderReport(data) {
  const issues = data.report.issues || [];
  const verdict = data.report.passed
    ? `<span class="ok">passed</span>`
    : `<span style="color:var(--amber)">flagged</span>`;
  const list = issues.length
    ? issues.map(i => `<div class="issue"><span class="sev">${i.severity} · ${i.where}</span><div>${i.message}</div></div>`).join('')
    : `<div class="issue">No issues raised.</div>`;
  reportEl.hidden = false;
  reportEl.innerHTML = `<h2>Validation · ${data.mode} · ${verdict}</h2>${list}`;
}
</script>
</body>
</html>
